name: Restore profile banner image

on:
  push:
    paths:
      - '.github/workflows/restore-profile-banner.yml'

permissions:
  contents: write

jobs:
  restore-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore previously published Waguri PNG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/banner
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/ZahdanGG/ZahdanGG/666edbb1dd8938692bcd8c1991675db00df51da3/WaguriBanner.png' \
            -o assets/banner/WaguriBanner.png
          test "$(git hash-object assets/banner/WaguriBanner.png)" = '869d5f6ef858070bb42bb857ede5041b740dc1b1'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/banner/WaguriBanner.png
          if git diff --cached --quiet; then
            echo "Banner already available"
            exit 0
          fi
          git commit -m "Restore public Waguri banner image"
          git push origin HEAD:main
